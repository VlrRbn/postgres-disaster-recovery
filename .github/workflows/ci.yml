name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static checks
        run: make check
      - name: Verify backup, isolated restore, and failure detection
        run: make acceptance
      - name: Show recovery measurement
        run: cat .local/reports/*.json
      - name: Verify acknowledged workload and archive-outage recovery
        run: make rpo-acceptance
      - name: Show acknowledged workload RPO
        run: cat .local/reports/*-rpo.json
      - name: Verify optional pgAdmin access and persistence
        run: make pgadmin-acceptance
