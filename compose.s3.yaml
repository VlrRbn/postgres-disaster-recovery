services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    entrypoint: [bash, /opt/s3-entrypoint.sh]
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      - ./sql/001-orders.sql:/docker-entrypoint-initdb.d/001-orders.sql:ro
      - ./scripts/s3-entrypoint.sh:/opt/s3-entrypoint.sh:ro
    secrets:
      - pgbackrest_s3
    networks:
      - repository

  restore:
    extends:
      file: compose.yaml
      service: restore
    user: root
    entrypoint: [bash, /opt/s3-entrypoint.sh]
    command:
      - gosu
      - postgres
      - postgres
      - -D
      - /var/lib/postgresql/data
      - -c
      - archive_mode=off
      - -c
      - archive_command=
      - -c
      - listen_addresses=
    # Outbound S3/IMDS access; SQL stays on the container's Unix socket.
    network_mode: bridge
    volumes: !override
      - pgrestore:/var/lib/postgresql/data
      - ./scripts/restore-volume.sh:/opt/restore-volume.sh:ro
      - ./scripts/s3-entrypoint.sh:/opt/s3-entrypoint.sh:ro
    secrets:
      - pgbackrest_s3

secrets:
  postgres_password:
    file: ${PGDR_SECRET_FILE:-./.local/s3/postgres_password}
  pgbackrest_s3:
    file: ${PGDR_S3_DIR:-./.local/s3}/pgbackrest.conf

volumes:
  pgdata:
  pgrestore:

networks:
  database:
    internal: true
  repository:
    # Outbound HTTPS to AWS S3; PostgreSQL still publishes no host port.
