services:
  postgres:
    build: &postgres-build
      context: ./docker/postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=orders archive-push %p
      - -c
      - archive_timeout=60s
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgrepo:/var/lib/pgbackrest
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./sql/001-orders.sql:/docker-entrypoint-initdb.d/001-orders.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d orders']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    networks:
      - database

  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    # The official entrypoint reads the 0600 secret, then runs pgAdmin as UID 5050.
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_DISABLE_POSTFIX: '1'
      PGADMIN_LISTEN_PORT: '5050'
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: 'False'
    secrets:
      - pgadmin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:5050'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - database
      - ui

  restore:
    profiles: [restore]
    build: *postgres-build
    user: postgres
    # Bypass initdb: starting an empty target must fail, not create a new database.
    entrypoint: [postgres]
    command:
      - -D
      - /var/lib/postgresql/data
      - -c
      - archive_mode=off
      - -c
      - archive_command=
      - -c
      - listen_addresses=
    volumes:
      - pgrestore:/var/lib/postgresql/data
      - pgrepo:/var/lib/pgbackrest:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./scripts/restore-volume.sh:/opt/restore-volume.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(psql -X -U postgres -d orders -Atc 'SELECT NOT pg_is_in_recovery()')" = t
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    stop_grace_period: 30s
    shm_size: 128mb
    mem_limit: 512m
    cpus: 1.0
    network_mode: none

secrets:
  pgadmin_password:
    file: ${PGDR_PGADMIN_SECRET_FILE:-./.local/pgadmin_password}
  postgres_password:
    file: ${PGDR_SECRET_FILE:-./.local/postgres_password}

volumes:
  pgadmin_data:
  pgdata:
  pgrepo:
  pgrestore:

networks:
  ui:
  database:
    internal: true
