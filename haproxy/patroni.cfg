global
    log stdout format raw local0
    maxconn 100

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout check 3s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen postgres_primary
    bind :5432
    # SQL/TLS passes through unchanged; only the role check uses HTTPS here.
    option httpchk GET /primary
    option log-health-checks
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 init-state fully-down on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg1 pg1:5432 check port 8008 check-ssl verify required ca-file /run/secrets/ca.crt verifyhost pg1
    server pg2 pg2:5432 check port 8008 check-ssl verify required ca-file /run/secrets/ca.crt verifyhost pg2
